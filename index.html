<style>
:root{
  --paper:#F3EEE4; --card:#FBF8F2; --ink:#1F2A2E; --muted:#6E716B; --line:#DED5C6;
  --accent:#8A5A33; --accent-ink:#FBF8F2;
  --ok:#4C7E5A; --warn:#B8862E; --over:#B4463A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#161D20; --card:#1F282C; --ink:#ECE5D8; --muted:#9BA19B; --line:#2F3B3F; --accent:#D2A274; --accent-ink:#1B2326; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
main{max-width:600px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.2}
h1{font-size:30px}
h2{font-size:21px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
.kopf{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 16px}
.kopf small{color:var(--muted);font-size:14px}
.karte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.leise{color:var(--muted);font-size:15px}
.zeile{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px;font-size:15px}
.farbe{display:inline-flex;align-items:center;gap:7px}
.punkt{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.held{position:relative;overflow:hidden;padding-top:24px}
.held::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--lit,#4C7E5A)}
.held h1{margin-top:2px}
.held .unter{margin-top:6px;font-family:var(--serif);font-size:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap}
.chip b{font-weight:600}
.liste{list-style:none;margin:0;padding:0}
.liste li{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.liste li:first-child{border-top:0}
.liste .dat{font-size:14px;color:var(--muted);line-height:1.25}
.liste .dat b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.liste .name{font-size:16px;line-height:1.3}
.liste .name small{display:block;color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:2px}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-size:16px}
.knopf.haupt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.knopf.breit{width:100%;padding:15px;font-size:18px}
.knopf.klein{padding:6px 10px;font-size:14px;border-radius:9px}
.knopf:active{transform:scale(.98)}
.textknopf{border:0;background:none;color:var(--accent);padding:4px 0;font-size:15px}
.datum-wahl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.datum-wahl input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:15px}
.widmung{background:var(--ink);color:var(--paper);border:0}
.widmung p{margin:6px 0 10px;font-family:var(--serif);font-size:19px}
.widmung .textknopf{color:var(--paper);opacity:.75}
.fuss{font-size:13px;color:var(--muted);margin-top:18px}
.predigt{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.predigt a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.predigt .mehr{margin-top:8px;font-size:14px}
.liste .predigt{margin-top:3px;padding-top:0;border-top:0;font-size:13px}
.liste .predigt .leise{font-size:13px}

/* Sitzungsuhr */
.feld{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px}
.feld:focus{outline:2px solid var(--accent);outline-offset:-1px}
.reihe2{display:grid;grid-template-columns:1fr 110px;gap:10px;margin-top:10px}
label.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.vorlagen{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.top{border-top:1px solid var(--line);padding:12px 0}
.top:first-child{border-top:0;padding-top:4px}
.top-kopf{display:flex;gap:10px;align-items:center}
.top-nr{font-family:var(--serif);font-weight:600;color:var(--muted);width:26px;flex:none;text-align:right}
.top-kopf .feld{flex:1}
.top-fuss{display:flex;align-items:center;gap:4px;margin:8px 0 0 0}
.mchip{border:1px solid var(--line);background:var(--paper);border-radius:9px;width:38px;height:36px;font-size:15px;padding:0}
.mchip.an,.mfrei.an{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.mfrei{width:46px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--card);text-align:center;font-size:15px;padding:0;-moz-appearance:textfield}
.mfrei::-webkit-outer-spin-button,.mfrei::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mfrei::placeholder{color:var(--muted)}
.icon:disabled{opacity:.35}
.minuten{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.minuten button{border:0;background:var(--paper);width:34px;height:36px;font-size:19px}
.minuten input{width:44px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;height:36px;background:var(--card);font-size:16px;-moz-appearance:textfield}
.minuten input::-webkit-outer-spin-button,.minuten input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.top-fuss .min-l{font-size:14px;color:var(--muted)}
.top-fuss .rechts{margin-left:auto;display:flex;gap:4px}
.top-kopf .icon{flex:none}
.haken{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-family:var(--serif);font-weight:600;font-size:16px;padding:0;color:var(--accent-ink)}
.top.gewaehlt .haken{background:var(--accent);border-color:var(--accent)}
.top:not(.gewaehlt) .feld::placeholder{color:var(--muted);font-style:italic}
.top.gewaehlt .feld::placeholder{color:var(--ink);opacity:1}
.top:not(.gewaehlt) .top-fuss{opacity:.5}
.icon{border:1px solid var(--line);background:var(--card);border-radius:9px;width:34px;height:36px;font-size:15px;line-height:1}
.summe{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--muted);margin-top:4px}
.schalter{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.schalter input{width:20px;height:20px;accent-color:var(--accent)}

.lauf{text-align:center;padding:22px 18px;border-top:8px solid var(--ok);transition:border-color .4s}
.lauf.warn{border-top-color:var(--warn)}
.lauf.over{border-top-color:var(--over)}
.lauf .wo{font-size:14px;color:var(--muted)}
.lauf h1{font-size:27px;margin:10px 0 4px;min-height:1.2em;overflow-wrap:anywhere}
.uhr{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:76px;font-weight:300;letter-spacing:-.02em;line-height:1.05;margin:14px 0 2px}
.lauf.warn .uhr{color:var(--warn)}
.lauf.over .uhr{color:var(--over)}
.uhr-l{font-size:14px;color:var(--muted)}
.balken{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:16px 0 4px}
.balken i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s linear,background .4s}
.lauf.warn .balken i{background:var(--warn)}
.lauf.over .balken i{background:var(--over)}
.steuer{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;margin-top:18px}
.steuer .knopf{padding:15px 8px}
.prognose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.prognose div{background:var(--paper);border-radius:12px;padding:10px;text-align:left}
.prognose b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.prognose span{font-size:13px;color:var(--muted)}
.danach{margin-top:14px;font-size:15px;color:var(--muted)}
.pausiert .uhr{opacity:.45}
.mini-liste{list-style:none;margin:0;padding:0;font-size:15px}
.mini-liste li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.mini-liste li:first-child{border-top:0}
.mini-liste li.jetzt{font-weight:600}
.mini-liste li.fertig{color:var(--muted)}
.mini-liste li.ende,.ende-zeile{font-weight:600;border-top:2px solid var(--line)}
.ende-zeile{display:flex;justify-content:space-between;gap:10px;padding:12px 0 2px;margin-top:4px;font-size:16px}
.mini-liste .z{font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--over)} .minus{color:var(--ok)}
table.bilanz{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.bilanz th{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 0 6px 8px}

<script>
/* ===== Widmung: hier anpassen ===== */
const WIDMUNG = {
  zeile: "Herzlichen Glückwunsch zum Geburtstag, Gottes Segen für alle Sitzungen und Dienste!",
  von: "Herzliche Grüße von Sebastian Keller."
};

/* ===== Speicher (darf fehlen) ===== */
const speicher = {
  lies(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  schreib(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const $ = (s,el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/*KJ-START*/
const TAG = 864e5;
function dn(y,m,d){ return Math.round(Date.UTC(y,m,d)/TAG); }
function vonDn(n){ const t = new Date(n*TAG); return {y:t.getUTCFullYear(), m:t.getUTCMonth(), d:t.getUTCDate()}; }
function wt(n){ return ((n+4)%7+7)%7; } // 0 = Sonntag
function heuteDn(){ const t = new Date(); return dn(t.getFullYear(), t.getMonth(), t.getDate()); }
function ostern(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        mon=Math.floor((h+l-7*m+114)/31), tag=((h+l-7*m+114)%31)+1;
  return dn(y, mon-1, tag);
}
function advent1(y){ const w = dn(y,11,25); const a4 = w - (wt(w)===0 ? 7 : wt(w)); return a4 - 21; }
const FARBEN = {
  violett:{name:"Violett", hex:"#6A4A8C"},
  weiss:{name:"Weiß", hex:"#F4EEE0"},
  gruen:{name:"Grün", hex:"#4C7E5A"},
  rot:{name:"Rot", hex:"#B4463A"},
  schwarz:{name:"Schwarz", hex:"#232323"}
};
const ROEM = ["I","II","III","IV","V","VI"];
function reihe(Y){ return ROEM[((Y-2018)%6+6)%6]; }
function kjVon(n){ const y = vonDn(n).y; return n >= advent1(y) ? y : y-1; }

const kjCache = {};
function kirchenjahr(Y){
  if (kjCache[Y]) return kjCache[Y];
  const E = ostern(Y+1), A = advent1(Y), A2 = advent1(Y+1);
  const L = [];
  const add = (d, name, sub, farbe, o={}) => {
    const prio = o.prio ?? (o.zivil ? 0 : o.klein ? 0.5 : o.fest ? 2 : 1);
    L.push(Object.assign({d, name, sub, farbe, Y, prio}, o));
  };
  const y = Y;
  ["1. Sonntag im Advent","2. Sonntag im Advent","3. Sonntag im Advent","4. Sonntag im Advent"]
    .forEach((n,i) => add(A+7*i, n, "", "violett"));
  add(dn(y,11,24), "Heiligabend", "Christvesper und Christnacht", "weiss", {fest:true});
  add(dn(y,11,25), "Christfest I", "1. Weihnachtstag", "weiss", {fest:true, feiertag:true});
  add(dn(y,11,26), "Christfest II", "2. Weihnachtstag", "weiss", {fest:true, feiertag:true});
  for (let d=dn(y,11,27); d<=dn(y,11,31); d++) if (wt(d)===0) add(d, "1. Sonntag nach dem Christfest", "", "weiss");
  add(dn(y,11,31), "Altjahrsabend", "Silvester", "weiss", {fest:true});
  add(dn(y+1,0,1), "Neujahrstag", "", "weiss", {fest:true, feiertag:true});
  for (let d=dn(y+1,0,2); d<=dn(y+1,0,5); d++) if (wt(d)===0) add(d, "2. Sonntag nach dem Christfest", "", "weiss");
  const epi = dn(y+1,0,6);
  add(epi, "Epiphanias", "Fest der Erscheinung des Herrn", "weiss", {fest:true});
  const inv = E-42, esto = inv-7;
  const feb2 = dn(y+1,1,2);
  let letzter = feb2 - wt(feb2);
  if (letzter >= esto) letzter = esto - 7;
  let k = 1;
  for (let d = epi + (7 - wt(epi)); d < letzter; d += 7) add(d, k++ + ". Sonntag nach Epiphanias", "", "weiss");
  add(letzter, "Letzter Sonntag nach Epiphanias", "", "weiss");
  add(feb2, "Darstellung des Herrn", "Lichtmess", "weiss", {klein:true});
  [["Estomihi","Sonntag vor der Passionszeit"],["Sexagesimae","2. Sonntag vor der Passionszeit"],
   ["Septuagesimae","3. Sonntag vor der Passionszeit"],["4. Sonntag vor der Passionszeit",""],["5. Sonntag vor der Passionszeit",""]]
    .forEach((v,i) => { const d = inv-7*(i+1); if (d > letzter) add(d, v[0], v[1], "gruen"); });
  add(inv-4, "Aschermittwoch", "Beginn der Passionszeit", "violett", {fest:true});
  [["Invokavit","1. Sonntag der Passionszeit"],["Reminiszere","2. Sonntag der Passionszeit"],
   ["Okuli","3. Sonntag der Passionszeit"],["Lätare","4. Sonntag der Passionszeit",{hinweis:"oder Rosa"}],
   ["Judika","5. Sonntag der Passionszeit"],["Palmsonntag","6. Sonntag der Passionszeit"]]
    .forEach((v,i) => add(inv+7*i, v[0], v[1], "violett", v[2]||{}));
  add(E-3, "Gründonnerstag", "", "weiss", {fest:true});
  add(E-2, "Karfreitag", "", "schwarz", {fest:true, feiertag:true, hinweis:"oder ohne Paramente"});
  add(E, "Ostersonntag", "Fest der Auferstehung des Herrn", "weiss", {fest:true});
  add(E+1, "Ostermontag", "", "weiss", {fest:true, feiertag:true});
  [["Quasimodogeniti","1. Sonntag nach Ostern"],["Miserikordias Domini","2. Sonntag nach Ostern"],
   ["Jubilate","3. Sonntag nach Ostern"],["Kantate","4. Sonntag nach Ostern"],["Rogate","5. Sonntag nach Ostern"]]
    .forEach((v,i) => add(E+7*(i+1), v[0], v[1], "weiss"));
  add(E+39, "Christi Himmelfahrt", "", "weiss", {fest:true, feiertag:true});
  add(E+42, "Exaudi", "6. Sonntag nach Ostern", "weiss");
  add(E+49, "Pfingstsonntag", "Fest des Heiligen Geistes", "rot", {fest:true});
  add(E+50, "Pfingstmontag", "", "rot", {fest:true, feiertag:true});
  add(E+56, "Trinitatis", "Tag der Heiligen Dreifaltigkeit", "weiss");
  const ewig = A2-7, vorl = A2-14, dritt = A2-21;
  for (let n=1, d=E+63; d<dritt; n++, d+=7)
    add(d, n + ". Sonntag nach Trinitatis", n===10 ? "Israelsonntag" : "", "gruen", n===10 ? {hinweis:"oder Violett"} : {});
  add(dritt, "Drittletzter Sonntag des Kirchenjahres", "", "gruen");
  add(vorl, "Vorletzter Sonntag des Kirchenjahres", "", "gruen");
  add(ewig-4, "Buß- und Bettag", "", "violett", {fest:true, feiertag:true});
  add(ewig, "Ewigkeitssonntag", "Letzter Sonntag des Kirchenjahres", "weiss");
  add(dn(y+1,5,24), "Johannistag", "Geburt Johannes des Täufers", "weiss", {klein:true});
  add(dn(y+1,8,29), "Michaelistag", "Tag des Erzengels Michael und aller Engel", "weiss", {klein:true});
  const okt1 = dn(y+1,9,1);
  add(okt1 + ((7-wt(okt1))%7), "Erntedankfest", "vielerorts am 1. Sonntag im Oktober", "gruen", {prio:2});
  add(dn(y+1,9,31), "Reformationstag", "", "rot", {fest:true, feiertag:true});
  add(dn(y+1,4,1), "Tag der Arbeit", "", null, {zivil:true, feiertag:true});
  add(dn(y+1,9,3), "Tag der Deutschen Einheit", "", null, {zivil:true, feiertag:true});
  L.sort((a,b) => a.d - b.d || b.prio - a.prio);
  const zeiten = [
    [A, "Advent"], [dn(y,11,24), "Christfest"], [epi, "Epiphaniaszeit"], [letzter+7, "Vorpassionszeit"],
    [inv-4, "Passionszeit"], [E, "Osterzeit"], [E+49, "Pfingsten"], [E+56, "Trinitatiszeit"], [dritt, "Ende des Kirchenjahres"]
  ];
  return kjCache[Y] = {Y, E, A, A2, inv, L, zeiten};
}

function tagInfo(n){
  const Y = kjVon(n), K = kirchenjahr(Y);
  const heute = K.L.filter(e => e.d === n);
  const lit = heute.filter(e => !e.zivil);
  const primaer = lit[0] || null;
  let woche = null;
  for (const e of K.L) {
    if (e.d > n) break;
    if (wt(e.d) === 0 && !e.zivil && !e.klein && (!woche || e.d > woche.d)) woche = e;
  }
  let farbe = primaer ? primaer.farbe : woche.farbe;
  let hinweis = primaer ? primaer.hinweis : woche.hinweis;
  if (!primaer) {
    if (n >= dn(Y,11,24) && n <= dn(Y+1,0,5)) { farbe = "weiss"; hinweis = null; }
    else if (n >= K.inv-4 && n < K.E) { farbe = "violett"; hinweis = null; }
  }
  let zeit = K.zeiten[0][1];
  for (const [ab, name] of K.zeiten) if (n >= ab) zeit = name;
  return {n, Y, reihe: reihe(Y), heute, lit, primaer, woche, farbe, hinweis, zeit, feiertag: heute.some(e => e.feiertag)};
}

function kommende(n, anzahl){
  const Y = kjVon(n), out = [];
  for (const y of [Y, Y+1, Y+2]) {
    for (const e of kirchenjahr(y).L) { if (e.d >= n) out.push(e); if (out.length >= anzahl) return out; }
  }
  return out;
}
function naechstes(n, name){
  for (const y of [kjVon(n), kjVon(n)+1]) {
    const e = kirchenjahr(y).L.find(x => x.d >= n && x.name === name);
    if (e) return e;
  }
  return null;
}
/*KJ-END*/

function predigtFuer(e){ return e ? (PREDIGT[reihe(e.Y)] || {})[e.name] || [] : []; }
function bibelUrl(ref){
  const m = ref.match(/^((?:\d\.\s?)?[A-Za-zÄÖÜäöüß]+)\s*(.*)$/);
  if (!m) return null;
  const buch = m[1].replace(/\s+/g, "");
  const spec = m[2].replace(/(\d)[ab]\b/g, "$1").replace(/[()]/g, ".").replace(/\s+/g, "");
  const tok = spec.match(/\d+|[,;.\-–]/g) || [];
  let kap = null, erst = null, letzt = null;
  for (let i = 0; i < tok.length; i++) {
    const t = tok[i];
    if (!/^\d+$/.test(t)) continue;
    if (tok[i+1] === ",") { kap = Number(t); continue; }
    if (kap === null) continue;
    const v = [kap, Number(t)];
    if (!erst) erst = v;
    letzt = v;
  }
  if (!erst) return null;
  let stelle;
  if (erst[0] === letzt[0]) stelle = erst[1] === letzt[1] ? `${erst[0]},${erst[1]}` : `${erst[0]},${erst[1]}-${letzt[1]}`;
  else stelle = `${erst[0]},${erst[1]}-${letzt[0]},${letzt[1]}`;
  return "https://www.bibleserver.com/LUT/" + encodeURIComponent(buch) + stelle;
}
function predigtHtml(e, mitKopf = true){
  const liste = predigtFuer(e);
  const kopf = mitKopf ? `<div class="kicker" style="margin:0 0 4px">Predigttext · Reihe ${reihe(e.Y)}</div>` : "";
  const mehr = mitKopf && DKJ[e.name] ? `<div class="mehr"><a href="${DKJ[e.name]}#:~:text=Proprium" target="_blank" rel="noopener">Mehr zum Tag auf daskirchenjahr.de</a></div>` : "";
  if (!liste.length) return mitKopf ? `<div class="predigt">${kopf}<span class="leise">für diesen Tag in der App noch nicht hinterlegt</span>${mehr}</div>` : "";
  return `<div class="predigt">${kopf}${liste.map(p => {
    const url = bibelUrl(p.ref);
    const txt = esc(p.ref);
    return `<div>${p.label ? `<span class="leise">${esc(p.label)}: </span>` : ""}${url ? `<a href="${url}" target="_blank" rel="noopener">${txt}</a>` : txt}</div>`;
  }).join("")}${mehr}</div>`;
}

/* ===== Formatierung ===== */
const WT = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const WTK = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function datumLang(n, mitJahr=true){ const t = vonDn(n); return `${WT[wt(n)]}, ${t.d}. ${MON[t.m]}${mitJahr ? " " + t.y : ""}`; }
function datumKurz(n){ const t = vonDn(n); return `${t.d}.${t.m+1}.`; }
function abstand(tage){ return tage === 0 ? "heute" : tage === 1 ? "morgen" : tage === 2 ? "übermorgen" : `in ${tage} Tagen`; }
function farbPunkt(f){ const F = FARBEN[f]; return F ? `<span class="punkt" style="background:${F.hex}"></span>` : ""; }

/* ===== Ansicht: Kirchenjahr ===== */
let ansichtDn = null, listeAnzahl = 10;
function zeigeKirchenjahr(){
  const echtHeute = heuteDn();
  const n = ansichtDn ?? echtHeute;
  const I = tagInfo(n);
  const istHeute = n === echtHeute;
  const F = FARBEN[I.farbe];
  let html = "";

  if (!speicher.lies("zuo.widmung.gesehen") && WIDMUNG.zeile) {
    html += `<div class="karte widmung"><div class="kicker" style="color:inherit;opacity:.7">Gewidmet</div>
      <p>${esc(WIDMUNG.zeile)}</p><div class="leise" style="color:inherit;opacity:.75">${esc(WIDMUNG.von)}</div>
      <button class="textknopf" id="widmung-zu">Ausblenden</button></div>`;
  }

  html += `<div class="kopf"><h2>${istHeute ? "Heute" : "Ausgewählter Tag"}</h2><small>Kirchenjahr ${I.Y}/${String(I.Y+1).slice(2)}</small></div>`;

  let kicker, titel, unter, wochenZeile = "";
  if (I.primaer) {
    kicker = datumLang(n, !istHeute);
    titel = I.primaer.name; unter = I.primaer.sub;
    const weitere = I.lit.slice(1).map(e => e.name);
    if (weitere.length) unter = [unter, "zugleich " + weitere.join(", ")].filter(Boolean).join(" · ");
    if (I.woche && I.woche.d !== n) wochenZeile = `<div class="leise" style="margin-top:6px">Woche: ${esc(I.woche.name)}</div>`;
  } else {
    kicker = datumLang(n, !istHeute) + " · Diese Woche";
    titel = I.woche.name; unter = I.woche.sub;
  }
  const zivil = I.heute.filter(e => e.zivil).map(e => e.name);
  html += `<div class="karte held" style="--lit:${F.hex}">
    <div class="kicker">${esc(kicker)}</div>
    <h1>${esc(titel)}</h1>
    ${unter ? `<div class="unter">${esc(unter)}</div>` : ""}
    ${wochenZeile}
    <div class="zeile">
      <span class="farbe">${farbPunkt(I.farbe)} ${F.name}${I.hinweis ? ` <span class="leise">(${esc(I.hinweis)})</span>` : ""}</span>
      <span>Reihe ${I.reihe}</span>
      <span class="leise">${esc(I.zeit)}</span>
      ${I.feiertag ? `<span class="badge" style="margin:0">Feiertag in Sachsen${zivil.length ? ": " + esc(zivil.join(", ")) : ""}</span>` : ""}
    </div>
    ${predigtHtml(I.primaer || I.woche)}
    <div class="datum-wahl" style="margin-top:14px">
      <input type="date" id="datum" value="${isoVon(n)}" aria-label="Anderes Datum">
      ${istHeute ? "" : `<button class="textknopf" id="zu-heute">Zurück zu heute</button>`}
    </div>
  </div>`;

  // Kommender Sonntag
  const so = n + (7 - wt(n));
  const S = tagInfo(so);
  const SP = S.primaer || S.woche;
  const neuesJahr = S.Y !== I.Y;
  html += `<div class="karte">
    <div class="kicker">Kommender Sonntag · ${datumKurz(so)}</div>
    <h2>${esc(SP.name)}</h2>
    ${SP.sub ? `<div class="leise" style="margin-top:3px">${esc(SP.sub)}${S.lit.length > 1 ? " · zugleich " + esc(S.lit.slice(1).map(e => e.name).join(", ")) : ""}</div>` : (S.lit.length > 1 ? `<div class="leise" style="margin-top:3px">zugleich ${esc(S.lit.slice(1).map(e => e.name).join(", "))}</div>` : "")}
    <div class="zeile"><span class="farbe">${farbPunkt(S.farbe)} ${FARBEN[S.farbe].name}${S.hinweis ? ` <span class="leise">(${esc(S.hinweis)})</span>` : ""}</span>
    <span>Reihe ${S.reihe}${neuesJahr ? ` <span class="leise">· neues Kirchenjahr</span>` : ""}</span></div>
    ${predigtHtml(SP)}
  </div>`;

  // Countdown
  const ziele = ["1. Sonntag im Advent","Heiligabend","Ostersonntag","Pfingstsonntag","Reformationstag","Buß- und Bettag"]
    .map(nm => naechstes(n, nm)).filter(Boolean).sort((a,b) => a.d - b.d).slice(0,4);
  const kurzName = {"1. Sonntag im Advent":"1. Advent","Ostersonntag":"Ostern","Pfingstsonntag":"Pfingsten"};
  html += `<div class="chips">${ziele.map(e => `<span class="chip">${esc(kurzName[e.name] || e.name)} <b>${abstand(e.d - n)}</b></span>`).join("")}</div>`;

  // Liste
  const liste = kommende(n + 1, listeAnzahl);
  html += `<div class="karte"><div class="kicker">Demnächst</div><ul class="liste">` +
    liste.map(e => `<li>
      <div class="dat"><b>${datumKurz(e.d)}</b>${WTK[wt(e.d)]}</div>
      <div class="name">${esc(e.name)}${e.feiertag ? `<span class="badge">Feiertag</span>` : ""}${e.sub ? `<small>${esc(e.sub)}</small>` : ""}${e.zivil ? "" : predigtHtml(e, false)}</div>
      <div>${e.zivil ? "" : farbPunkt(e.farbe)}</div></li>`).join("") +
    `</ul><button class="textknopf" id="mehr" style="margin-top:6px">Weitere anzeigen</button></div>`;

  html += `<p class="fuss">Sonntage und Feste nach der Ordnung gottesdienstlicher Texte und Lieder (2018), Feiertage nach sächsischem Recht. Predigttexte nach den Übersichten der Deutschen Bibelgesellschaft (Exegese für die Predigt) und daskirchenjahr.de; die Bibellinks öffnen die Lutherbibel 2017 auf bibleserver.com. Die App rechnet ohne Internet. Liturgische Farben nach verbreitetem Gebrauch; örtliche Tradition kann abweichen.</p>`;

  const v = $("#v-kirchenjahr");
  v.innerHTML = html;
  $("#datum", v).addEventListener("change", ev => {
    const s = ev.target.value; if (!s) return;
    const [yy,mm,dd] = s.split("-").map(Number);
    ansichtDn = dn(yy, mm-1, dd); listeAnzahl = 10; zeigeKirchenjahr();
  });
  const zh = $("#zu-heute", v); if (zh) zh.onclick = () => { ansichtDn = null; listeAnzahl = 10; zeigeKirchenjahr(); };
  $("#mehr", v).onclick = () => { listeAnzahl += 15; zeigeKirchenjahr(); };
  const wz = $("#widmung-zu", v); if (wz) wz.onclick = () => { speicher.schreib("zuo.widmung.gesehen", true); zeigeKirchenjahr(); };
}
function isoVon(n){ const t = vonDn(n); return `${t.y}-${String(t.m+1).padStart(2,"0")}-${String(t.d).padStart(2,"0")}`; }

function ausVorlage(k){ const V = VORLAGEN[k]; return {titel: V.titel, tops: V.tops.map(([t,m]) => ({id: uid++, titel: "", vorschlag: t, an: false, min: m}))}; }
function effTitel(t){ return t.titel.trim() || (t.an && t.vorschlag ? t.vorschlag : ""); }
const SK = "zuo.sitzung.v2";
let S = speicher.lies(SK);
if (!S || !Array.isArray(S.tops)) { const v = ausVorlage("leer"); S = {titel: v.titel, beginn: "19:30", tops: v.tops, ton: false, lauf: null, bilanz: null}; }
S.tops.forEach(t => { t.id = uid++; if (t.an === undefined) { t.an = !!t.titel.trim(); t.vorschlag = t.vorschlag || ""; } });
const sichern = () => speicher.schreib(SK, S);

function aktiveTops(){ return S.tops.filter(t => t.an && effTitel(t)); }
function planMin(){ return (S.lauf ? S.tops : aktiveTops()).reduce((s,t) => s + (Number(t.min)||0), 0); }
function dauer(min){ min = Math.round(min); const h = Math.floor(min/60), m = min%60; return h ? `${h} Std.${m ? " " + m + " Min." : ""}` : `${m} Min.`; }
function uhrzeit(ms){ const d = new Date(ms); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function mmss(ms){ const s = Math.floor(Math.abs(ms)/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}` : `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`; }
function beginnPlusMin(hhmm, min){ const [h,m] = (hhmm||"19:30").split(":").map(Number); const t = (h*60 + m + min) % 1440; return `${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; }

    <div style="display:flex;align-items:center;gap:12px;margin-top:14px">
      <label class="lab" for="s-beginn" style="margin:0">Beginn</label>
      <input class="feld" type="time" id="s-beginn" value="${esc(S.beginn)}" style="width:130px">
    </div>
  </div>
  <div class="karte"><div class="kicker">Tagesordnung · Dauer in Minuten</div>
    <p class="leise" style="margin:0 0 6px">Vorschläge antippen, um sie zu übernehmen, oder einfach überschreiben. Was nicht ausgewählt ist, entfällt.</p><div id="tops"></div><div class="ende-zeile" id="ende-zeile"></div></div>
  <button class="knopf breit" id="top-neu" style="margin-bottom:14px">+ TOP hinzufügen</button>
  <datalist id="top-vorschlaege">${TOP_VORSCHLAEGE.map(x => `<option value="${esc(x)}">`).join("")}</datalist>
  <div class="karte">
    <div class="summe" id="summe"></div>
    <label class="schalter"><input type="checkbox" id="s-ton" ${S.ton ? "checked" : ""}> Leiser Gong, wenn ein TOP seine Zeit erreicht</label>
    <button class="knopf haupt breit" id="start" style="margin-top:16px">Sitzung beginnen</button>
    <div class="leise" id="start-hinweis" style="margin-top:8px;text-align:center"></div>
  </div>
  <p class="fuss">Die Tagesordnung bleibt auf diesem Gerät gespeichert. Während die Uhr läuft, bleibt der Bildschirm an, soweit der Browser das erlaubt.</p>`;
  zeichneTops();
  $("#s-titel").oninput = e => { S.titel = e.target.value; sichern(); };
  $("#s-beginn").onchange = e => { S.beginn = e.target.value; sichern(); summe(); };
  $("#s-ton").onchange = e => { S.ton = e.target.checked; sichern(); };
  v.querySelectorAll("[data-vl]").forEach(b => b.onclick = () => {
    const x = ausVorlage(b.dataset.vl); S.titel = x.titel; S.tops = x.tops; sichern(); zeigeEditor();
  });
  $("#top-neu").onclick = () => { S.tops.push({id: uid++, titel: "", vorschlag: "", an: false, min: 10}); sichern(); zeichneTops(); const f = v.querySelectorAll(".top .feld"); f[f.length-1].focus(); };
  $("#start").onclick = starte;
}
function summe(){
  const el = $("#summe"); if (!el) return;
  const p = planMin();
  const n = aktiveTops().length;
  el.innerHTML = `<span>${n} TOP${n === 1 ? "" : "s"} · ${dauer(p)}</span><span>Ende ca. ${beginnPlusMin(S.beginn, p)} Uhr</span>`;
  const ez = $("#ende-zeile");
  if (ez) ez.innerHTML = `<span>Sitzungsende</span><span>ca. ${beginnPlusMin(S.beginn, p)} Uhr</span>`;
}
function zeichneTops(){
  const box = $("#tops");
  let nr = 0;
  box.innerHTML = S.tops.map((t,i) => {
    const an = t.an && !!effTitel(t);
    const n = an ? ++nr : "";
    return `
    <div class="top${an ? " gewaehlt" : ""}" data-i="${i}">
      <div class="top-kopf">
        <button class="haken" data-a="wahl" aria-pressed="${an}" aria-label="${an ? "TOP abwählen" : "TOP übernehmen"}">${n}</button>
        <input class="feld" data-f="titel" value="${esc(t.titel)}" placeholder="${esc(t.vorschlag || "Titel (hier eintragen)")}" list="top-vorschlaege" autocomplete="off">
        <button class="icon" data-a="weg" aria-label="TOP entfernen">✕</button></div>
      <div class="top-fuss">
        ${MINUTEN.map(m => `<button class="mchip${t.min === m ? " an" : ""}" data-m="${m}">${m}</button>`).join("")}
        <input class="mfrei${MINUTEN.includes(t.min) ? "" : " an"}" type="number" inputmode="numeric" min="1" max="600" data-f="min" value="${MINUTEN.includes(t.min) ? "" : t.min}" placeholder="frei" aria-label="Minuten frei eintragen">
        <span class="rechts">
          <button class="icon" data-a="hoch" aria-label="nach oben" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="icon" data-a="runter" aria-label="nach unten" ${i === S.tops.length-1 ? "disabled" : ""}>↓</button>
        </span>
      </div>
    </div>`; }).join("") || `<p class="leise">Noch keine Tagesordnungspunkte.</p>`;
  box.querySelectorAll(".top").forEach(row => {
    const i = Number(row.dataset.i), t = S.tops[i];
    const titel = row.querySelector('[data-f="titel"]');
    titel.oninput = () => {
      const vorher = t.an && !!effTitel(t);
      t.titel = titel.value;
      if (t.titel.trim()) t.an = true;
      sichern();
      if (vorher !== (t.an && !!effTitel(t))) nummeriere(); else summe();
    };
    const frei = row.querySelector('[data-f="min"]');
    const markiere = () => {
      row.querySelectorAll(".mchip").forEach(c => c.classList.toggle("an", Number(c.dataset.m) === t.min && frei.value === ""));
      frei.classList.toggle("an", frei.value !== "");
    };
    const waehle = () => { if (!t.an && (t.vorschlag || t.titel.trim())) { t.an = true; nummeriere(); } };
    row.querySelectorAll(".mchip").forEach(c => c.onclick = () => { t.min = Number(c.dataset.m); frei.value = ""; markiere(); waehle(); sichern(); summe(); });
    frei.oninput = () => { const x = parseInt(frei.value,10); if (x > 0) { t.min = Math.min(600, x); waehle(); sichern(); summe(); } markiere(); };
    row.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if (a === "wahl") {
        if (t.an && effTitel(t)) t.an = false;
        else if (t.vorschlag || t.titel.trim()) t.an = true;
        else { titel.focus(); return; }
        sichern(); nummeriere(); return;
      }
      if (a === "hoch" && i > 0) [S.tops[i-1], S.tops[i]] = [S.tops[i], S.tops[i-1]];
      if (a === "runter" && i < S.tops.length-1) [S.tops[i+1], S.tops[i]] = [S.tops[i], S.tops[i+1]];
      if (a === "weg") S.tops.splice(i,1);
      sichern(); zeichneTops();
    });
  });
  summe();
}
function nummeriere(){
  let nr = 0;
  $("#tops").querySelectorAll(".top").forEach(row => {
    const t = S.tops[Number(row.dataset.i)], an = t.an && !!effTitel(t);
    row.classList.toggle("gewaehlt", an);
    const h = row.querySelector(".haken");
    h.textContent = an ? ++nr : "";
    h.setAttribute("aria-pressed", an);
    h.setAttribute("aria-label", an ? "TOP abwählen" : "TOP übernehmen");
  });
  const sh = $("#start-hinweis"); if (sh) sh.textContent = "";
  summe();
}

/* Lauf */
let tick = null, wachsperre = null, audio = null;
async function wachHalten(){ try { if ("wakeLock" in navigator && S.lauf && document.visibilityState === "visible") wachsperre = await navigator.wakeLock.request("screen"); } catch(e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.lauf) wachHalten(); });
function audioBereit(){ try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch(e) { audio = null; } }
function gong(){
  if (!audio) return;
  try {
    const t0 = audio.currentTime;
    [[392,0.22],[588,0.09],[784,0.05]].forEach(([f,g]) => {
      const o = audio.createOscillator(), v = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      v.gain.setValueAtTime(0.0001, t0); v.gain.exponentialRampToValueAtTime(g, t0 + 0.02); v.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
      o.connect(v).connect(audio.destination); o.start(t0); o.stop(t0 + 2.5);
    });
  } catch(e) {}
}
function verstrichen(i, jetzt = Date.now()){ const L = S.lauf; return L.ist[i] + (i === L.idx && L.seit ? jetzt - L.seit : 0); }
function verbuchen(){ const L = S.lauf, j = Date.now(); if (L.seit) { L.ist[L.idx] += j - L.seit; L.seit = j; } }

function starte(){
  const aktiv = aktiveTops();
  if (!aktiv.length) { const h = $("#start-hinweis"); if (h) h.textContent = "Bitte mindestens einen TOP auswählen oder eintragen."; return; }
  S.tops = aktiv.map(t => ({id: t.id, titel: effTitel(t), vorschlag: "", an: true, min: t.min}));
  const j = Date.now();
  S.lauf = {idx: 0, beginn: j, ist: S.tops.map(() => 0), seit: j, planEnde: j + planMin()*60000, gegongt: []};
  S.bilanz = null; sichern();
  if (S.ton) audioBereit();
  wachHalten();
  zeigeLauf();
}
function zeigeLauf(){
  const v = $("#v-sitzung");
  v.innerHTML = `
  <div class="karte lauf" id="lauf">
    <div class="wo" id="l-wo"></div>
    <h1 id="l-titel"></h1>
    <div class="uhr" id="l-uhr">00:00</div>
    <div class="uhr-l" id="l-uhr-l"></div>
    <div class="balken"><i id="l-balken"></i></div>
    <div class="steuer">
      <button class="knopf" id="l-zurueck" aria-label="vorheriger TOP">←</button>
      <button class="knopf" id="l-pause">Pause</button>
      <button class="knopf haupt" id="l-weiter">Nächster TOP</button>
    </div>
    <div class="danach" id="l-danach"></div>
  </div>
  <div class="karte">
    <div class="prognose">
      <div><span>Ende bei diesem Tempo</span><b id="l-ende"></b><span id="l-delta"></span></div>
      <div><span>Sitzung läuft seit</span><b id="l-gesamt"></b><span id="l-plan"></span></div>
    </div>
  </div>
  <div class="karte"><div class="kicker">Tagesordnung</div><ul class="mini-liste" id="l-liste"></ul></div>
  <button class="knopf breit" id="l-ende-btn">Sitzung beenden</button>`;
  $("#l-weiter").onclick = () => { verbuchen(); const L = S.lauf;
    if (L.idx < S.tops.length-1) { L.idx++; L.seit = Date.now(); sichern(); aktualisiere(true); } else beende(); };
  $("#l-zurueck").onclick = () => { verbuchen(); const L = S.lauf; if (L.idx > 0) { L.idx--; L.seit = L.seit ? Date.now() : null; sichern(); aktualisiere(true); } };
  $("#l-pause").onclick = () => { const L = S.lauf, j = Date.now();
    if (L.seit) { L.ist[L.idx] += j - L.seit; L.seit = null; } else L.seit = j; sichern(); aktualisiere(true); };
  let sicher = null;
  $("#l-ende-btn").onclick = e => {
    const b = e.currentTarget;
    if (sicher) { clearTimeout(sicher); beende(); return; }
    b.textContent = "Wirklich beenden? Nochmal tippen"; b.classList.add("haupt");
    sicher = setTimeout(() => { sicher = null; b.textContent = "Sitzung beenden"; b.classList.remove("haupt"); }, 3500);
  };
  clearInterval(tick); tick = setInterval(() => aktualisiere(false), 250);
  aktualisiere(true);
}
function aktualisiere(voll){
  if (!S.lauf || !$("#lauf")) { clearInterval(tick); return; }
  const L = S.lauf, j = Date.now(), t = S.tops[L.idx];
  const plan = t.min * 60000, ist = verstrichen(L.idx, j), rest = plan - ist;
  const warnAb = Math.max(60000, plan * 0.2);
  const zustand = rest < 0 ? "over" : rest <= warnAb ? "warn" : "ok";
  const box = $("#lauf");
  box.className = "karte lauf " + (zustand === "ok" ? "" : zustand) + (L.seit ? "" : " pausiert");
  $("#l-uhr").textContent = (rest < 0 ? "+" : "") + mmss(rest);
  $("#l-uhr-l").textContent = !L.seit ? "angehalten" : rest < 0 ? "über der geplanten Zeit" : "verbleibend";
  $("#l-balken").style.width = Math.min(100, ist / plan * 100) + "%";
  if (rest < 0 && S.ton && !L.gegongt.includes(L.idx)) { L.gegongt.push(L.idx); sichern(); gong(); }
  let spaeter = 0; for (let i = L.idx+1; i < S.tops.length; i++) spaeter += S.tops[i].min * 60000;
  const ende = j + Math.max(rest, 0) + spaeter;
  const delta = Math.round((ende - L.planEnde) / 60000);
  $("#l-ende").textContent = uhrzeit(ende) + " Uhr";
  $("#l-delta").innerHTML = delta > 0 ? `<span class="plus">${delta} Min. hinter dem Plan</span>` : delta < 0 ? `<span class="minus">${-delta} Min. Vorsprung</span>` : "im Plan";
  $("#l-gesamt").textContent = mmss(j - L.beginn);
  $("#l-plan").textContent = `geplant ${dauer(planMin())}`;
  if (voll) {
    $("#l-wo").textContent = `${S.titel || "Sitzung"} · TOP ${L.idx+1} von ${S.tops.length}`;
    $("#l-titel").textContent = t.titel;
    $("#l-pause").textContent = L.seit ? "Pause" : "Weiter";
    $("#l-zurueck").disabled = L.idx === 0; $("#l-zurueck").style.opacity = L.idx === 0 ? .35 : 1;
    $("#l-weiter").textContent = L.idx < S.tops.length-1 ? "Nächster TOP" : "Abschließen";
    const n = S.tops[L.idx+1];
    $("#l-danach").textContent = n ? `Danach: ${n.titel} (${n.min} Min.)` : "Letzter Tagesordnungspunkt";
  }
  $("#l-liste").innerHTML = S.tops.map((x,i) => {
    const e = verstrichen(i, j), d = e - x.min*60000;
    const z = i < L.idx || (i !== L.idx && e > 0) ? `${mmss(e)} <span class="${d > 0 ? "plus" : "minus"}">${d > 0 ? "+" : "−"}${Math.round(Math.abs(d)/60000)}</span>` : i === L.idx ? mmss(e) + " / " + x.min + ":00" : x.min + " Min.";
    return `<li class="${i === L.idx ? "jetzt" : i < L.idx ? "fertig" : ""}"><span>${i+1}. ${esc(x.titel)}</span><span class="z">${z}</span></li>`;
  }).join("") + `<li class="ende"><span>Sitzungsende</span><span class="z">ca. ${uhrzeit(ende)} Uhr</span></li>`;
}
function beende(){
  verbuchen();
  const L = S.lauf, j = Date.now();
  S.bilanz = {titel: S.titel || "Sitzung", beginn: L.beginn, ende: j, tops: S.tops.map((t,i) => ({titel: t.titel, plan: t.min, ist: L.ist[i]}))};
  S.lauf = null; sichern(); clearInterval(tick);
  try { if (wachsperre) { wachsperre.release(); wachsperre = null; } } catch(e) {}
  zeigeBilanz();
}
function datumVon(ms){ const d = new Date(ms); return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`; }
function protokollTitel(B){ return B.protokollTitel ?? `Protokoll: ${B.titel} vom ${datumVon(B.beginn)}`; }
function bilanzText(B){
  const plan = B.tops.reduce((s,t) => s + t.plan, 0), ist = (B.ende - B.beginn) / 60000;
  const zeilen = B.tops.map((t,i) => `TOP ${i+1} ${t.titel}: geplant ${t.plan} Min., ${t.ist ? "tatsächlich " + Math.round(t.ist/60000) + " Min." : "nicht behandelt"}`);
  return `${protokollTitel(B)}\n\nSitzungsbeginn: ${uhrzeit(B.beginn)} Uhr\n` + zeilen.join("\n") +
    `\nSitzungsende: ${uhrzeit(B.ende)} Uhr\n\nDauer: ${dauer(ist)} (geplant ${dauer(plan)})`;
}
function zeigeBilanz(){
  const B = S.bilanz, v = $("#v-sitzung");
  const plan = B.tops.reduce((s,t) => s + t.plan, 0), ist = Math.round((B.ende - B.beginn) / 60000);
  const diff = ist - plan;
  v.innerHTML = `
  <div class="kopf"><h2>Sitzungsbilanz</h2><small>${uhrzeit(B.beginn)}–${uhrzeit(B.ende)} Uhr</small></div>
  <div class="karte">
    <label class="lab" for="b-titel">Titel fürs Protokoll</label>
    <input class="feld" id="b-titel" value="${esc(protokollTitel(B))}" autocomplete="off">
  </div>
  <div class="karte">
    <div class="kicker">${esc(B.titel)}</div>
    <h1 style="font-size:26px">${dauer(ist)} <span class="leise" style="font-family:var(--sans);font-size:16px">statt ${dauer(plan)}</span></h1>
    <div class="leise" style="margin-top:4px">${diff > 0 ? diff + " Min. länger als geplant" : diff < 0 ? -diff + " Min. früher fertig" : "Punktlandung"}</div>
    <table class="bilanz"><thead><tr><th>TOP</th><th>Plan</th><th>Ist</th><th>±</th></tr></thead><tbody>
    ${B.tops.map((t,i) => { const m = Math.round(t.ist/60000), d = m - t.plan;
      return `<tr><td>${i+1}. ${esc(t.titel)}</td><td>${t.plan}</td><td>${t.ist ? m : "–"}</td><td class="${t.ist ? (d > 0 ? "plus" : "minus") : ""}">${t.ist ? (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d) : ""}</td></tr>`; }).join("")}
    </tbody><tfoot><tr><td>Sitzungsende</td><td colspan="3">${uhrzeit(B.ende)} Uhr</td></tr></tfoot></table>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button class="knopf" id="b-kopie">Als Text kopieren</button><span id="b-ok"></span>
    <button class="knopf haupt" id="b-neu" style="margin-left:auto">Neue Sitzung</button>
  </div>
  <div id="b-feld"></div>`;
  $("#b-titel").oninput = e => { B.protokollTitel = e.target.value; sichern(); };
  $("#b-kopie").onclick = async () => {
    const txt = bilanzText(B);
    try { await navigator.clipboard.writeText(txt); $("#b-ok").innerHTML = `<span class="kopiert">Kopiert</span>`; }
    catch(e) { $("#b-feld").innerHTML = `<textarea class="kopie" readonly>${esc(txt)}</textarea>`; const ta = $("#b-feld textarea"); ta.focus(); ta.select(); }
  };
  $("#b-neu").onclick = () => { S.bilanz = null; sichern(); zeigeEditor(); };
}

/* ===== Über ===== */
function zeigeInfo(){
  $("#v-info").innerHTML = `
  <div class="kopf"><h2>Zeit &amp; Ordnung</h2><small>Version 1.0</small></div>
  <div class="karte widmung"><p>${esc(WIDMUNG.zeile)}</p><div class="leise" style="color:inherit;opacity:.75">${esc(WIDMUNG.von)}</div></div>
  <div class="karte info">
    <h3>Auf den Home-Bildschirm</h3>
    <p><b>iPhone:</b> Seite in Safari öffnen, unten auf das Teilen-Symbol tippen, „Zum Home-Bildschirm“ wählen. Danach startet die App wie jede andere.</p>
    <p><b>Windows:</b> Seite in Edge öffnen, Menü „…“ → „Apps“ → „Diese Website als App installieren“.</p>
  </div>
  <div class="karte info">
    <h3>Kirchenjahr</h3>
    <p>Welcher Sonntag, welche Farbe, welche Perikopenreihe – für heute und jedes andere Datum. Sonntage, Feste und sächsische Feiertage werden aus dem Ostertermin errechnet, auch für kommende Jahre.</p>
    <h3 style="margin-top:14px">Sitzungsuhr</h3>
    <p>Tagesordnung eintragen, Minuten vergeben, Sitzung beginnen. Die Uhr zählt pro TOP herunter, wird gelb, wenn es knapp wird, und rot, wenn die Zeit überschritten ist. Die Prognose zeigt jederzeit, wann die Sitzung bei diesem Tempo endet. Am Schluss steht eine Bilanz, die sich ins Protokoll kopieren lässt.</p>
  </div>
  <div class="karte info">
    <h3>Daten</h3>
    <p>Die App braucht kein Konto und schickt nichts ins Netz. Tagesordnungen bleiben im Browser dieses Geräts.</p>
  </div>`;
}

/* ===== Navigation ===== */
const ANSICHTEN = ["kirchenjahr","sitzung","info"];
let aktuell = null;
function zeige(h){
  if (!ANSICHTEN.includes(h)) h = S.lauf ? "sitzung" : "kirchenjahr";
  aktuell = h;
  ANSICHTEN.forEach(a => $("#v-" + a).classList.toggle("versteckt", a !== h));
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("an", b.dataset.v === h));
  if (h === "kirchenjahr") zeigeKirchenjahr();
  if (h === "sitzung") zeigeSitzung();
  if (h === "info") zeigeInfo();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => zeige(b.dataset.v)));
window.addEventListener("hashchange", () => zeige((location.hash || "").replace("#","")));
// Datumswechsel um Mitternacht
let letzterTag = heuteDn();
setInterval(() => { const t = heuteDn(); if (t !== letzterTag) { letzterTag = t; if (aktuell === "kirchenjahr" && ansichtDn === null) zeigeKirchenjahr(); } }, 60000);
zeige((location.hash || "").replace("#",""));
</script>
</body>
</html>
